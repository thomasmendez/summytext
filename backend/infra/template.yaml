AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  summytext backend - container-image Lambda (flair/transformers predict endpoint)
  exposed directly via a Lambda Function URL. Built and deployed with `sam build`
  / `sam deploy --guided`, which builds the Dockerfile in ../ and pushes the
  resulting image to ECR as part of the deploy. One stack per environment
  (dev/stg/prd).

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, stg, prd, test]
    Description: >
      Deployment environment. Drives resource names and the ENV variable
      passed to the app (which selects CORS origins).
      `test` is for throwaway/scratch stacks only (e.g. verifying a deploy
      end-to-end without touching real dev/stg/prd resources) — delete the
      stack when done with it.

  MemorySize:
    Type: Number
    Default: 10240
    MinValue: 128
    MaxValue: 10240
    Description: >
      Lambda memory in MB. The baked-in models are ~4GB of weights resident in
      memory; keep enough headroom above that for request handling. Lambda
      also scales CPU allocation with memory, which speeds up the heavy
      torch/transformers/flair imports and model deserialization on cold
      start — set to the max while cold-start duration is still being
      diagnosed.

  Timeout:
    Type: Number
    Default: 900
    MinValue: 1
    MaxValue: 900
    Description: >
      Lambda function timeout in seconds. Models are lazy-loaded on first
      request after a cold start, so this needs to comfortably cover that
      first, slower request.

  LogRetentionInDays:
    Type: Number
    Default: 14

Resources:
  EcrRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub summytext-backend-${Environment}
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 14 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 14
                },
                "action": { "type": "expire" }
              }
            ]
          }

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/summytext-backend-${Environment}
      RetentionInDays: !Ref LogRetentionInDays

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub summytext-backend-${Environment}-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  LambdaFunction:
    Type: AWS::Serverless::Function
    DependsOn: LambdaLogGroup
    Metadata:
      # Tells `sam build` how to build the image: Dockerfile and app code live
      # one level up from this template, in backend/.
      Dockerfile: Dockerfile
      DockerContext: ../
      DockerTag: latest
    Properties:
      FunctionName: !Sub summytext-backend-${Environment}
      PackageType: Image
      Role: !GetAtt LambdaExecutionRole.Arn
      MemorySize: !Ref MemorySize
      Timeout: !Ref Timeout
      Environment:
        Variables:
          # Drives the CORS origins in app/main.py. PROXY is intentionally left
          # unset: a Function URL has no stage path prefix (unlike the old HTTP
          # API's /{env} stage), so FastAPI's root_path must stay empty.
          ENV: !Ref Environment
      # Expose the function directly via a Lambda Function URL instead of API
      # Gateway. HTTP APIs have a hard 30s integration timeout that cannot be
      # raised, so cold starts (~60s while models load) always 504'd and the
      # frontend retried. Function URLs honor the full function Timeout (up to
      # 15 min), so a cold request completes instead of failing. CORS is handled
      # by FastAPI's CORSMiddleware (env-driven) -- configuring a Cors block here
      # too would emit duplicate Access-Control-* headers and break the browser.
      FunctionUrlConfig:
        AuthType: NONE

Outputs:
  FunctionUrl:
    Description: >
      Public HTTPS endpoint for this environment (Lambda Function URL). It has a
      trailing slash and no stage prefix -- call it directly, e.g.
      <FunctionUrl>api/v1/predict/. Set the frontend's SUM_MY_TEXT_SERVICE to
      this value WITHOUT the trailing slash.
    Value: !GetAtt LambdaFunctionUrl.FunctionUrl

  LambdaFunctionArn:
    Value: !GetAtt LambdaFunction.Arn

  EcrRepositoryUri:
    Value: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EcrRepository}
